<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111111" />
    <title>Cloud Gallery</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <div>
          <span>Yandex Object Storage</span>
          <h1>Cloud Gallery</h1>
        </div>
        <strong id="photo-count">Loading...</strong>
      </header>

      <section class="gallery" id="gallery" aria-label="Cloud photo gallery"></section>
    </main>

    <template id="photo-template">
      <a class="photo-card" target="_blank" rel="noreferrer">
        <img loading="lazy" decoding="async" alt="" />
        <span></span>
      </a>
    </template>

    <script src="./app.js"></script>
  </body>
</html>
