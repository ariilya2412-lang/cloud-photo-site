<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090a0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gallery">
  <title>Gallery</title>
  <link rel="preconnect" href="https://functions.yandexcloud.net">
  <style>
    :root {
      color-scheme: dark;
      --bg: #090a0d;
      --surface: #121318;
      --surface-strong: #1a1b21;
      --control: #23242b;
      --border: rgba(255, 255, 255, 0.09);
      --text: #f5f5f7;
      --muted: #92939d;
      --accent: #0a84ff;
      --danger: #ff453a;
      --header-height: 158px;
      --radius: 8px;
    }

    body.light {
      color-scheme: light;
      --bg: #f3f3f6;
      --surface: #ffffff;
      --surface-strong: #ececf1;
      --control: #e4e4e9;
      --border: rgba(0, 0, 0, 0.08);
      --text: #111114;
      --muted: #74747d;
      --accent: #007aff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
        "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
    }

    button,
    input,
    select {
      color: inherit;
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: calc(env(safe-area-inset-top) + 10px) 14px 10px;
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(24px) saturate(1.35);
      -webkit-backdrop-filter: blur(24px) saturate(1.35);
    }

    .topbar {
      min-height: 44px;
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      gap: 8px;
    }

    .brand {
      min-width: 0;
      text-align: center;
    }

    .brand h1 {
      overflow: hidden;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0;
      line-height: 24px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .brand p {
      margin-top: 1px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      line-height: 14px;
    }

    .icon-button {
      width: 40px;
      height: 40px;
      display: inline-grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: var(--surface-strong);
      font-size: 18px;
      transition: transform 120ms ease, background 120ms ease;
    }

    .icon-button:active {
      transform: scale(0.92);
    }

    .folders {
      display: flex;
      gap: 8px;
      margin-top: 9px;
      overflow-x: auto;
      padding: 2px 0 4px;
      scroll-snap-type: x proximity;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .folders::-webkit-scrollbar {
      display: none;
    }

    .folder-button {
      min-width: 44px;
      height: 34px;
      flex: 0 0 auto;
      padding: 0 13px;
      border: 1px solid var(--border);
      border-radius: 17px;
      background: var(--surface);
      color: var(--muted);
      font-size: 14px;
      font-weight: 650;
      scroll-snap-align: center;
      transition: color 140ms ease, background 140ms ease, transform 120ms ease;
    }

    .folder-button.active {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .folder-button:active {
      transform: scale(0.95);
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto auto;
      gap: 8px;
      margin-top: 8px;
    }

    .search {
      position: relative;
      min-width: 0;
    }

    .search::before {
      content: "⌕";
      position: absolute;
      top: 50%;
      left: 12px;
      color: var(--muted);
      font-size: 20px;
      transform: translateY(-52%);
      pointer-events: none;
    }

    .search input {
      width: 100%;
      height: 38px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      outline: 0;
      background: var(--surface);
      padding: 0 12px 0 36px;
      font-size: 15px;
    }

    .search input::placeholder {
      color: var(--muted);
    }

    .tool-button {
      min-width: 40px;
      height: 38px;
      padding: 0 11px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      font-size: 16px;
      font-weight: 650;
    }

    .tool-button:active {
      background: var(--control);
    }

    .tool-button.active {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .content {
      min-height: 50vh;
      padding: 10px 8px calc(env(safe-area-inset-bottom) + 22px);
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 3px;
    }

    .photo-grid.size-small {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .photo-grid.size-large {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 5px;
    }

    .photo {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      overflow: hidden;
      border-radius: 3px;
      background: var(--surface);
      content-visibility: auto;
      contain-intrinsic-size: 160px;
    }

    .size-large .photo {
      border-radius: 6px;
    }

    .photo img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      opacity: 0;
      transform: scale(1.015);
      transition: opacity 220ms ease, transform 300ms ease;
    }

    .photo img.loaded {
      opacity: 1;
      transform: scale(1);
    }

    .photo:active img {
      transform: scale(0.97);
    }

    .photo.loading::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        100deg,
        transparent 20%,
        color-mix(in srgb, var(--text) 7%, transparent) 45%,
        transparent 70%
      );
      transform: translateX(-100%);
      animation: shimmer 1.25s infinite;
    }

    @keyframes shimmer {
      to { transform: translateX(100%); }
    }

    .state {
      min-height: calc(100vh - var(--header-height) - env(safe-area-inset-top));
      display: grid;
      place-items: center;
      padding: 40px 24px;
      text-align: center;
    }

    .state[hidden] {
      display: none;
    }

    .state-box {
      max-width: 290px;
    }

    .state-icon {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      margin: 0 auto 15px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: var(--surface);
      color: var(--muted);
      font-size: 25px;
    }

    .state h2 {
      font-size: 20px;
      font-weight: 700;
    }

    .state p {
      margin-top: 7px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .retry-button {
      height: 40px;
      margin-top: 18px;
      padding: 0 20px;
      border-radius: 20px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
    }

    .spinner {
      width: 26px;
      height: 26px;
      margin: 0 auto 16px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 700ms linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .viewer {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      flex-direction: column;
      background: #000;
      color: #fff;
      user-select: none;
    }

    .viewer.open {
      display: flex;
    }

    .viewer-bar {
      position: absolute;
      left: 0;
      right: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      transition: opacity 180ms ease;
    }

    .viewer-top {
      top: 0;
      min-height: calc(env(safe-area-inset-top) + 58px);
      justify-content: space-between;
      padding: calc(env(safe-area-inset-top) + 8px) 12px 8px;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.72), transparent);
    }

    .viewer-bottom {
      bottom: 0;
      min-height: calc(env(safe-area-inset-bottom) + 74px);
      justify-content: center;
      gap: 18px;
      padding: 12px 14px calc(env(safe-area-inset-bottom) + 10px);
      background: linear-gradient(to top, rgba(0, 0, 0, 0.75), transparent);
    }

    .viewer.chrome-hidden .viewer-bar {
      opacity: 0;
      pointer-events: none;
    }

    .viewer-button {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 50%;
      background: rgba(28, 28, 30, 0.72);
      color: #fff;
      font-size: 19px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .viewer-button:active {
      transform: scale(0.91);
    }

    .viewer-meta {
      position: absolute;
      left: 50%;
      top: calc(env(safe-area-inset-top) + 17px);
      z-index: 2;
      color: rgba(255, 255, 255, 0.84);
      font-size: 13px;
      font-weight: 650;
      transform: translateX(-50%);
      white-space: nowrap;
    }

    .viewer-stage {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      touch-action: none;
    }

    .viewer-image {
      max-width: 100%;
      max-height: 100%;
      display: block;
      object-fit: contain;
      transform: translate3d(0, 0, 0) scale(1);
      transition: transform 180ms ease, opacity 130ms ease;
      will-change: transform;
    }

    .viewer-image.changing {
      opacity: 0.35;
    }

    .viewer-nav {
      position: absolute;
      top: 50%;
      z-index: 2;
      width: 42px;
      height: 54px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      background: rgba(20, 20, 22, 0.55);
      color: #fff;
      font-size: 25px;
      transform: translateY(-50%);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .viewer-prev { left: 10px; }
    .viewer-next { right: 10px; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(env(safe-area-inset-bottom) + 24px);
      z-index: 200;
      max-width: calc(100vw - 32px);
      padding: 11px 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      background: rgba(31, 31, 36, 0.92);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      transform: translate(-50%, 16px);
      opacity: 0;
      animation: toast-in 180ms ease forwards;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    @keyframes toast-in {
      to {
        opacity: 1;
        transform: translate(-50%, 0);
      }
    }

    @media (min-width: 700px) {
      .app-header {
        padding-left: max(20px, calc((100vw - 1100px) / 2));
        padding-right: max(20px, calc((100vw - 1100px) / 2));
      }

      .content {
        max-width: 1120px;
        margin: 0 auto;
        padding-left: 14px;
        padding-right: 14px;
      }

      .photo-grid {
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 5px;
      }

      .photo-grid.size-small {
        grid-template-columns: repeat(7, minmax(0, 1fr));
      }

      .photo-grid.size-large {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 440px) {
      .viewer-nav {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="topbar">
      <button class="icon-button" id="themeButton" type="button" aria-label="Сменить тему" title="Тема">◐</button>
      <div class="brand">
        <h1 id="title">Галерея</h1>
        <p id="subtitle">Загрузка коллекции</p>
      </div>
      <button class="icon-button" id="reloadButton" type="button" aria-label="Обновить" title="Обновить">↻</button>
    </div>
    <nav class="folders" id="folders" aria-label="Папки"></nav>
    <div class="toolbar">
      <label class="search">
        <input id="searchInput" type="search" placeholder="Поиск" autocomplete="off" aria-label="Поиск фотографий">
      </label>
      <button class="tool-button" id="mixButton" type="button" aria-label="Перемешать все фото" title="Случайные 50 фото">⤨</button>
      <button class="tool-button" id="sortButton" type="button" aria-label="Изменить сортировку" title="Сортировка">⇅</button>
      <button class="tool-button" id="gridButton" type="button" aria-label="Изменить размер сетки" title="Размер сетки">▦</button>
    </div>
  </header>

  <main class="content">
    <section class="state" id="loadingState">
      <div class="state-box">
        <div class="spinner"></div>
        <h2>Открываем галерею</h2>
        <p>Фотографии появятся через несколько секунд.</p>
      </div>
    </section>

    <section class="state" id="errorState" hidden>
      <div class="state-box">
        <div class="state-icon">!</div>
        <h2>Не удалось загрузить</h2>
        <p>Проверь подключение к интернету и попробуй еще раз.</p>
        <button class="retry-button" id="retryButton" type="button">Повторить</button>
      </div>
    </section>

    <section class="state" id="emptyState" hidden>
      <div class="state-box">
        <div class="state-icon">□</div>
        <h2>Здесь пока пусто</h2>
        <p id="emptyText">В этой папке нет фотографий.</p>
      </div>
    </section>

    <section class="photo-grid" id="photoGrid" aria-live="polite"></section>
  </main>

  <section class="viewer" id="viewer" aria-modal="true" role="dialog" aria-label="Просмотр фотографии">
    <div class="viewer-stage" id="viewerStage">
      <img class="viewer-image" id="viewerImage" alt="">
    </div>
    <div class="viewer-meta" id="viewerMeta"></div>
    <div class="viewer-bar viewer-top">
      <button class="viewer-button" id="closeViewer" type="button" aria-label="Закрыть">×</button>
      <div>
        <button class="viewer-button" id="downloadButton" type="button" aria-label="Скачать" title="Скачать">↓</button>
      </div>
    </div>
    <button class="viewer-nav viewer-prev" id="previousButton" type="button" aria-label="Предыдущее фото">‹</button>
    <button class="viewer-nav viewer-next" id="nextButton" type="button" aria-label="Следующее фото">›</button>
    <div class="viewer-bar viewer-bottom">
      <button class="viewer-button" id="zoomOutButton" type="button" aria-label="Уменьшить">−</button>
      <button class="viewer-button" id="zoomResetButton" type="button" aria-label="Сбросить масштаб">1×</button>
      <button class="viewer-button" id="zoomInButton" type="button" aria-label="Увеличить">+</button>
      <button class="viewer-button" id="playButton" type="button" aria-label="Слайд-шоу">▶</button>
    </div>
  </section>

  <script>
    (() => {
      "use strict";

      const API = "https://functions.yandexcloud.net/d4ecqr4bqsf8ndkrh1qk";
      const MIX_FOLDER = "__random_mix__";
      const MIX_LIMIT = 50;
      const IMAGE_EXTENSIONS = /\.(avif|gif|jpe?g|png|webp)$/i;
      const GRID_SIZES = ["medium", "small", "large"];
      const SORT_MODES = ["default", "name-asc", "name-desc"];
      const SORT_LABELS = {
        default: "По порядку",
        "name-asc": "Имя: А-Я",
        "name-desc": "Имя: Я-А"
      };

      const elements = {
        title: document.getElementById("title"),
        subtitle: document.getElementById("subtitle"),
        folders: document.getElementById("folders"),
        search: document.getElementById("searchInput"),
        mix: document.getElementById("mixButton"),
        sort: document.getElementById("sortButton"),
        grid: document.getElementById("gridButton"),
        theme: document.getElementById("themeButton"),
        reload: document.getElementById("reloadButton"),
        retry: document.getElementById("retryButton"),
        loading: document.getElementById("loadingState"),
        error: document.getElementById("errorState"),
        empty: document.getElementById("emptyState"),
        emptyText: document.getElementById("emptyText"),
        photoGrid: document.getElementById("photoGrid"),
        viewer: document.getElementById("viewer"),
        viewerStage: document.getElementById("viewerStage"),
        viewerImage: document.getElementById("viewerImage"),
        viewerMeta: document.getElementById("viewerMeta"),
        closeViewer: document.getElementById("closeViewer"),
        previous: document.getElementById("previousButton"),
        next: document.getElementById("nextButton"),
        download: document.getElementById("downloadButton"),
        zoomOut: document.getElementById("zoomOutButton"),
        zoomReset: document.getElementById("zoomResetButton"),
        zoomIn: document.getElementById("zoomInButton"),
        play: document.getElementById("playButton")
      };

      const state = {
        folders: new Map(),
        activeFolder: "",
        mixPhotos: [],
        visiblePhotos: [],
        search: "",
        sort: localStorage.getItem("gallerySort") || "default",
        gridSize: localStorage.getItem("galleryGrid") || "medium",
        viewerIndex: 0,
        scale: 1,
        offsetX: 0,
        offsetY: 0,
        startX: 0,
        startY: 0,
        lastX: 0,
        lastY: 0,
        dragging: false,
        pinchStart: 0,
        pinchScale: 1,
        slideshow: null,
        loadToken: 0
      };

      const photoUrl = key => `${API}?file=${encodeURIComponent(key)}`;

      const naturalCompare = (a, b) =>
        a.localeCompare(b, "ru", { numeric: true, sensitivity: "base" });

      const setStateView = name => {
        elements.loading.hidden = name !== "loading";
        elements.error.hidden = name !== "error";
        elements.empty.hidden = name !== "empty";
        elements.photoGrid.hidden = name !== "grid";
      };

      const showToast = message => {
        const toast = document.createElement("div");
        toast.className = "toast";
        toast.textContent = message;
        document.body.appendChild(toast);
        window.setTimeout(() => toast.remove(), 2100);
      };

      const normalizeFolder = key => {
        const parts = String(key).split("/").filter(Boolean);
        return parts.length > 1 ? parts[0] : "Без папки";
      };

      const folderSort = ([a], [b]) => {
        if (a === "Без папки") return 1;
        if (b === "Без папки") return -1;
        return naturalCompare(a, b);
      };

      const buildFolders = items => {
        const grouped = new Map();

        items.forEach(item => {
          const key = String(item && item.key ? item.key : "").trim();
          if (!key || !IMAGE_EXTENSIONS.test(key)) return;
          const folder = normalizeFolder(key);
          if (!grouped.has(folder)) grouped.set(folder, []);
          grouped.get(folder).push({
            key,
            name: key.split("/").pop() || key
          });
        });

        return new Map([...grouped.entries()].sort(folderSort));
      };

      const renderFolderButtons = () => {
        elements.folders.replaceChildren();
        const fragment = document.createDocumentFragment();

        state.folders.forEach((photos, folder) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = `folder-button${folder === state.activeFolder ? " active" : ""}`;
          button.textContent = folder;
          button.setAttribute("aria-label", `Папка ${folder}, ${photos.length} фото`);
          button.addEventListener("click", () => selectFolder(folder));
          fragment.appendChild(button);
        });

        elements.folders.appendChild(fragment);
        requestAnimationFrame(() => {
          elements.folders.querySelector(".active")?.scrollIntoView({
            behavior: "smooth",
            block: "nearest",
            inline: "center"
          });
        });
      };

      const getVisiblePhotos = () => {
        const photos = state.activeFolder === MIX_FOLDER
          ? [...state.mixPhotos]
          : [...(state.folders.get(state.activeFolder) || [])];
        const query = state.search.toLocaleLowerCase("ru");
        let result = query
          ? photos.filter(photo => photo.name.toLocaleLowerCase("ru").includes(query))
          : photos;

        if (state.sort === "name-asc") {
          result = result.sort((a, b) => naturalCompare(a.name, b.name));
        } else if (state.sort === "name-desc") {
          result = result.sort((a, b) => naturalCompare(b.name, a.name));
        }

        return result;
      };

      const loadImage = img => {
        const src = img.dataset.src;
        if (!src) return;
        delete img.dataset.src;
        img.src = src;
      };

      const renderPhotos = () => {
        state.visiblePhotos = getVisiblePhotos();
        elements.photoGrid.replaceChildren();
        elements.title.textContent = state.activeFolder === MIX_FOLDER
          ? "Случайные 50"
          : state.activeFolder === "Без папки"
            ? "Галерея"
            : `Папка ${state.activeFolder}`;
        elements.subtitle.textContent =
          `${state.visiblePhotos.length} ${state.visiblePhotos.length === 1 ? "фото" : "фото"}`;
        elements.mix.classList.toggle("active", state.activeFolder === MIX_FOLDER);

        if (!state.visiblePhotos.length) {
          elements.emptyText.textContent = state.search
            ? "По этому запросу ничего не найдено."
            : "В этой папке нет фотографий.";
          setStateView("empty");
          return;
        }

        const fragment = document.createDocumentFragment();
        const observer = new IntersectionObserver(entries => {
          entries.forEach(entry => {
            if (!entry.isIntersecting) return;
            const img = entry.target.querySelector("img");
            if (img) loadImage(img);
            observer.unobserve(entry.target);
          });
        }, { rootMargin: "500px 0px" });

        state.visiblePhotos.forEach((photo, index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "photo loading";
          button.setAttribute("aria-label", `Открыть фото ${index + 1}`);

          const img = document.createElement("img");
          img.dataset.src = photoUrl(photo.key);
          img.alt = "";
          img.loading = "lazy";
          img.decoding = "async";
          img.addEventListener("load", () => {
            button.classList.remove("loading");
            img.classList.add("loaded");
          }, { once: true });
          img.addEventListener("error", () => {
            button.classList.remove("loading");
            button.style.display = "none";
          }, { once: true });

          button.appendChild(img);
          button.addEventListener("click", () => openViewer(index));
          fragment.appendChild(button);
          observer.observe(button);
        });

        elements.photoGrid.appendChild(fragment);
        setStateView("grid");
      };

      const selectFolder = folder => {
        if (!state.folders.has(folder)) return;
        state.activeFolder = folder;
        state.mixPhotos = [];
        localStorage.setItem("galleryFolder", folder);
        renderFolderButtons();
        renderPhotos();
        window.scrollTo({ top: 0, behavior: "instant" });
      };

      const createRandomMix = () => {
        const allPhotos = [...state.folders.values()].flat();
        if (!allPhotos.length) {
          showToast("Фотографии еще загружаются");
          return;
        }
        const count = Math.min(MIX_LIMIT, allPhotos.length);

        for (let index = 0; index < count; index += 1) {
          const randomIndex = index + Math.floor(Math.random() * (allPhotos.length - index));
          [allPhotos[index], allPhotos[randomIndex]] = [allPhotos[randomIndex], allPhotos[index]];
        }

        state.mixPhotos = allPhotos.slice(0, count);
        state.activeFolder = MIX_FOLDER;
        state.search = "";
        elements.search.value = "";
        renderFolderButtons();
        renderPhotos();
        window.scrollTo({ top: 0, behavior: "instant" });
        showToast(`Перемешано: ${count} фото`);
      };

      const loadGallery = async () => {
        const token = ++state.loadToken;
        setStateView("loading");
        elements.subtitle.textContent = "Загрузка коллекции";

        try {
          const response = await fetch(API, { cache: "no-store" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = await response.json();
          if (!Array.isArray(data)) throw new Error("Некорректный ответ сервера");
          if (token !== state.loadToken) return;

          state.folders = buildFolders(data);
          if (!state.folders.size) {
            state.activeFolder = "";
            elements.folders.replaceChildren();
            elements.emptyText.textContent = "В облаке пока нет фотографий.";
            elements.title.textContent = "Галерея";
            elements.subtitle.textContent = "0 фото";
            setStateView("empty");
            return;
          }

          const savedFolder = localStorage.getItem("galleryFolder");
          state.activeFolder = state.folders.has(savedFolder)
            ? savedFolder
            : state.folders.keys().next().value;

          renderFolderButtons();
          renderPhotos();
        } catch (error) {
          if (token !== state.loadToken) return;
          console.error(error);
          elements.title.textContent = "Галерея";
          elements.subtitle.textContent = "Нет подключения";
          setStateView("error");
        }
      };

      const applyGridSize = () => {
        elements.photoGrid.classList.remove("size-small", "size-large");
        if (state.gridSize !== "medium") {
          elements.photoGrid.classList.add(`size-${state.gridSize}`);
        }
      };

      const updateTransform = animate => {
        elements.viewerImage.style.transition = animate
          ? "transform 180ms ease, opacity 130ms ease"
          : "none";
        elements.viewerImage.style.transform =
          `translate3d(${state.offsetX}px, ${state.offsetY}px, 0) scale(${state.scale})`;
      };

      const resetZoom = animate => {
        state.scale = 1;
        state.offsetX = 0;
        state.offsetY = 0;
        updateTransform(animate);
      };

      const setZoom = nextScale => {
        state.scale = Math.min(5, Math.max(1, nextScale));
        if (state.scale === 1) {
          state.offsetX = 0;
          state.offsetY = 0;
        }
        updateTransform(true);
      };

      const showViewerPhoto = direction => {
        const photo = state.visiblePhotos[state.viewerIndex];
        if (!photo) return;

        resetZoom(false);
        elements.viewerImage.classList.add("changing");
        elements.viewerImage.src = photoUrl(photo.key);
        elements.viewerImage.alt = `Фото ${state.viewerIndex + 1}`;
        elements.viewerMeta.textContent =
          `${state.viewerIndex + 1} из ${state.visiblePhotos.length}`;

        elements.viewerImage.onload = () => {
          elements.viewerImage.classList.remove("changing");
          if (direction) {
            elements.viewerImage.animate(
              [
                { transform: `translateX(${direction * 26}px) scale(0.985)`, opacity: 0.4 },
                { transform: "translateX(0) scale(1)", opacity: 1 }
              ],
              { duration: 180, easing: "ease-out" }
            );
          }
        };

        const preload = offset => {
          const index = (state.viewerIndex + offset + state.visiblePhotos.length)
            % state.visiblePhotos.length;
          const next = new Image();
          next.src = photoUrl(state.visiblePhotos[index].key);
        };
        preload(-1);
        preload(1);
      };

      const openViewer = index => {
        state.viewerIndex = index;
        elements.viewer.classList.add("open");
        document.body.style.overflow = "hidden";
        showViewerPhoto(0);
      };

      const closeViewer = () => {
        stopSlideshow();
        elements.viewer.classList.remove("open", "chrome-hidden");
        elements.viewerImage.removeAttribute("src");
        document.body.style.overflow = "";
        resetZoom(false);
      };

      const moveViewer = step => {
        if (!state.visiblePhotos.length) return;
        state.viewerIndex =
          (state.viewerIndex + step + state.visiblePhotos.length) % state.visiblePhotos.length;
        showViewerPhoto(step > 0 ? 1 : -1);
      };

      const stopSlideshow = () => {
        if (state.slideshow) {
          clearInterval(state.slideshow);
          state.slideshow = null;
        }
        elements.play.textContent = "▶";
        elements.play.setAttribute("aria-label", "Слайд-шоу");
      };

      const toggleSlideshow = () => {
        if (state.slideshow) {
          stopSlideshow();
          return;
        }
        state.slideshow = setInterval(() => moveViewer(1), 4000);
        elements.play.textContent = "Ⅱ";
        elements.play.setAttribute("aria-label", "Остановить слайд-шоу");
      };

      const downloadCurrent = async () => {
        const photo = state.visiblePhotos[state.viewerIndex];
        if (!photo) return;

        try {
          const response = await fetch(photoUrl(photo.key));
          if (!response.ok) throw new Error();
          const blob = await response.blob();
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = photo.name || "photo";
          document.body.appendChild(link);
          link.click();
          link.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          showToast("Фото подготовлено к сохранению");
        } catch {
          window.open(photoUrl(photo.key), "_blank");
        }
      };

      const touchDistance = touches => {
        const dx = touches[0].clientX - touches[1].clientX;
        const dy = touches[0].clientY - touches[1].clientY;
        return Math.hypot(dx, dy);
      };

      elements.search.addEventListener("input", event => {
        state.search = event.target.value.trim();
        renderPhotos();
      });

      elements.mix.addEventListener("click", createRandomMix);

      elements.sort.addEventListener("click", () => {
        const index = SORT_MODES.indexOf(state.sort);
        state.sort = SORT_MODES[(index + 1) % SORT_MODES.length];
        localStorage.setItem("gallerySort", state.sort);
        showToast(SORT_LABELS[state.sort]);
        renderPhotos();
      });

      elements.grid.addEventListener("click", () => {
        const index = GRID_SIZES.indexOf(state.gridSize);
        state.gridSize = GRID_SIZES[(index + 1) % GRID_SIZES.length];
        localStorage.setItem("galleryGrid", state.gridSize);
        applyGridSize();
      });

      elements.theme.addEventListener("click", () => {
        document.body.classList.toggle("light");
        localStorage.setItem("galleryTheme",
          document.body.classList.contains("light") ? "light" : "dark");
      });

      elements.reload.addEventListener("click", loadGallery);
      elements.retry.addEventListener("click", loadGallery);
      elements.closeViewer.addEventListener("click", closeViewer);
      elements.previous.addEventListener("click", () => moveViewer(-1));
      elements.next.addEventListener("click", () => moveViewer(1));
      elements.download.addEventListener("click", downloadCurrent);
      elements.zoomOut.addEventListener("click", () => setZoom(state.scale - 0.5));
      elements.zoomReset.addEventListener("click", () => resetZoom(true));
      elements.zoomIn.addEventListener("click", () => setZoom(state.scale + 0.5));
      elements.play.addEventListener("click", toggleSlideshow);

      elements.viewerStage.addEventListener("click", event => {
        if (event.detail === 1 && !state.dragging) {
          elements.viewer.classList.toggle("chrome-hidden");
        }
      });

      elements.viewerStage.addEventListener("dblclick", () => {
        setZoom(state.scale > 1 ? 1 : 2.5);
      });

      elements.viewerStage.addEventListener("touchstart", event => {
        if (event.touches.length === 2) {
          state.pinchStart = touchDistance(event.touches);
          state.pinchScale = state.scale;
          return;
        }
        const touch = event.touches[0];
        state.startX = state.lastX = touch.clientX;
        state.startY = state.lastY = touch.clientY;
        state.dragging = false;
      }, { passive: true });

      elements.viewerStage.addEventListener("touchmove", event => {
        if (event.touches.length === 2 && state.pinchStart) {
          event.preventDefault();
          const ratio = touchDistance(event.touches) / state.pinchStart;
          state.scale = Math.min(5, Math.max(1, state.pinchScale * ratio));
          updateTransform(false);
          return;
        }

        const touch = event.touches[0];
        const dx = touch.clientX - state.lastX;
        const dy = touch.clientY - state.lastY;
        state.lastX = touch.clientX;
        state.lastY = touch.clientY;

        if (Math.abs(touch.clientX - state.startX) > 8 ||
            Math.abs(touch.clientY - state.startY) > 8) {
          state.dragging = true;
        }

        if (state.scale > 1) {
          event.preventDefault();
          state.offsetX += dx;
          state.offsetY += dy;
          updateTransform(false);
        }
      }, { passive: false });

      elements.viewerStage.addEventListener("touchend", event => {
        if (event.touches.length < 2) state.pinchStart = 0;
        if (event.touches.length) return;

        const dx = state.lastX - state.startX;
        const dy = state.lastY - state.startY;
        if (state.scale === 1 && Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)) {
          moveViewer(dx < 0 ? 1 : -1);
        } else if (state.scale === 1 && dy > 100 && Math.abs(dy) > Math.abs(dx)) {
          closeViewer();
        }
        setTimeout(() => { state.dragging = false; }, 0);
      }, { passive: true });

      document.addEventListener("keydown", event => {
        if (!elements.viewer.classList.contains("open")) return;
        if (event.key === "Escape") closeViewer();
        if (event.key === "ArrowLeft") moveViewer(-1);
        if (event.key === "ArrowRight") moveViewer(1);
      });

      if (localStorage.getItem("galleryTheme") === "light") {
        document.body.classList.add("light");
      }
      applyGridSize();
      loadGallery();
    })();
  </script>
</body>
</html>
