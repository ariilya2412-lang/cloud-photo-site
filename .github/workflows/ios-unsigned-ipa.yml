name: Build Unsigned iPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync web bundle
        run: npm run sync:ios

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination generic/platform=iOS \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package unsigned ipa
        run: |
          APP_PATH="ios/build/Build/Products/Release-iphoneos/App.app"
          mkdir -p ios/ipa/Payload
          cp -R "$APP_PATH" ios/ipa/Payload/App.app
          cd ios/ipa
          /usr/bin/zip -r Gallery-unsigned.ipa Payload

      - name: Upload ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: gallery-unsigned-ipa
          path: ios/ipa/Gallery-unsigned.ipa
